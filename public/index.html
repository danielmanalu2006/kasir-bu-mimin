<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b3556">
  <title>Dapoer Bu Mimin</title>
  <link rel="icon" href="/img/Logo.png">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/pembeli.css">
</head>
<body class="halaman-pembeli">
  <!-- Halaman pembeli (tanpa login):
       /           → tamu: lihat jadwal & sisa stok
       /m/<kode>   → pembeli di meja (dari scan QR): bisa memesan & bayar QRIS (simulasi)
       /bayar/<kode> → halaman simulasi pembayaran QRIS
       Admin ada di /admin -->
  <header class="topbar">
    <a class="brand" href="/" id="brand" aria-label="Dapoer Bu Mimin">
      <span class="logo-mark" aria-hidden="true"></span>
      <span><b>Dapoer Bu Mimin</b><small>Menu &amp; Pemesanan</small></span>
    </a>
    <div class="spacer"></div>
    <span class="identitas" id="identitas" hidden></span>
  </header>

  <main id="app" aria-live="polite"></main>

  <div class="toast-wrap" id="toasts"></div>
  <script type="module" src="/js/pembeli.js"></script>
</body>
</html>
